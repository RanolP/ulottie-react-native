[package]
name = "ulottie-compiler"
version = "0.0.1"
authors = ["Hyeseong Kim <tim@daangn.com>"]
edition = "2024"

[lib]
path = "src/lib.rs"
# `cdylib` produces the wasm binary that wasm-bindgen wraps; `rlib` keeps
# the crate consumable as a normal Rust dependency for the dev server.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ulottie-compiler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# Decoding embedded image data URIs for the asset-extraction pass
# (`scene::assets`). No padded/URL-safe variants needed — bodymovin writes
# standard base64.
base64 = "0.22"
bitflags = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
clap = { version = "4", features = ["derive"] }
# Not optional: compiling Lottie means compiling the expressions in it, and
# that means parsing JavaScript. `src/expr/` reads the bodies as syntax rather
# than as text — the identifier scans it replaced could not tell an effect name
# from a string literal, and could not fold anything.
oxc_allocator = "0.131"
oxc_ast = "0.131"
oxc_parser = "0.131"
oxc_span = "0.131"
oxc_codegen = { version = "0.131", optional = true }
oxc_minifier = { version = "0.131", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
# Pure-Rust deflate, used only to *decide* whether instancing a precomp pays.
# `default-features = false` keeps it off the C zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[features]
# Pure-Rust frame emulator (Payload → structured `Frame`). On by default
# because downstream optimization layers (frame analysis to drop unused
# data, etc.) consume it. Peers that want only the compiler can opt out
# with `default-features = false`.
default = ["eval", "minify", "auto-instancing"]
eval = []
# Embedded-runtime minifier + dead-code elimination. Pulls in the oxc
# minifier crates (~15 transitive dependencies) so the compiler can emit
# tree-shaken, minified self-contained modules. The flag is on by default
# because that's the headline advantage of the data backend; opt out with
# `default-features = false` to keep the compiler crate lean.
minify = ["dep:oxc_codegen", "dep:oxc_minifier"]
# Browser bindings via wasm-bindgen. Exposes `compile_request(jsonText)`
# returning the raw bytes + sizes the comparison matrix needs. Gzip *sizes*
# are still measured client-side via `CompressionStream('gzip')`; `flate2`
# comes in through `auto-instancing` because the compiler has to compress
# internally to choose between the instanced and inlined builds, and a
# browser-hosted compiler that made that call differently from the CLI would
# be a worse tool, not a smaller one.
# Let the compiler decide per animation whether to instance precomps, by
# compiling both ways and keeping the smaller *compressed* module. Raw bytes
# are not a usable proxy — `precomp_star_circle` is 34% smaller raw when
# instanced and 19% larger gzipped, because gzip already deduplicates markup
# that fits in its 32 KiB window. Without this feature the decision falls back
# to a size heuristic; see `scene::worth_instancing`.
auto-instancing = ["dep:flate2"]
wasm = ["minify", "auto-instancing", "dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dev-dependencies]
insta = "1.41"

# The frame-snapshot integration test exercises the eval module, so it only
# builds when the feature is enabled. Run via `cargo nextest run --features eval`
# (or `--all-features`).
[[test]]
name = "frame_snapshot"
required-features = ["eval"]