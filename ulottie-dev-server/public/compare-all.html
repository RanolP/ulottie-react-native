<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Compare All Animations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui;
      background: #f0f0f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .controls {
      text-align: center;
      margin-bottom: 16px;
    }

    .controls select {
      font-size: 14px;
      padding: 4px 8px;
    }

    .controls input[type=range] {
      width: 400px;
      vertical-align: middle;
    }

    .controls label {
      font-size: 14px;
      font-weight: bold;
    }

    .compare {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .panel {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .panel h2 {
      font-size: 14px;
      text-align: center;
      margin-bottom: 8px;
      color: #666;
    }

    #lottie-ref {
      width: 300px;
      height: 300px;
    }

    #ulottie {
      width: 300px;
      height: 300px;
      overflow: hidden;
    }

    #ulottie svg {
      max-width: 300px;
      max-height: 300px;
      display: block;
    }

    /* Drop zone for ad-hoc JSON files. Whole page accepts drag-and-drop; the
       overlay surfaces while a file is being dragged over. */
    #drop-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 120, 255, 0.15);
      border: 4px dashed #0078ff;
      pointer-events: none;
      z-index: 1000;
    }

    #drop-hint.active {
      display: block;
    }

    #upload-status {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }

    #file-picker {
      display: inline-block;
      margin-left: 8px;
    }

    .sizes {
      margin: 16px auto 0;
      max-width: 640px;
      background: white;
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .sizes h2 {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 8px;
    }

    #size-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    #size-table th,
    #size-table td {
      padding: 4px 10px;
      text-align: right;
    }

    #size-table th:first-child,
    #size-table td:first-child {
      text-align: left;
    }

    #size-table thead th {
      border-bottom: 1px solid #ddd;
      font-weight: 600;
      color: #666;
    }

    #size-table tbody tr.delta {
      border-top: 1px solid #eee;
      font-weight: 600;
    }

    /* Delta cells color independently — raw and gz can disagree on sign
       (e.g. compiled JS shrinks raw but grows ~tens of bytes after gzip).
       Per-cell coloring makes the actual loss visible. */
    #size-table tbody td.loss {
      color: #c0392b;
    }

    #size-table tbody td.gain {
      color: #27ae60;
    }

    #size-table tbody tr.pipeline td {
      padding-top: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
    }

    #size-table tbody tr.subtotal td {
      font-weight: 600;
      border-top: 1px solid #f0f0f0;
    }

    #size-table tbody tr.measuring td {
      color: #999;
      font-style: italic;
    }

    /* "Tree-shaken: …" line under the embedded pipeline header — what the
       data backend decided this animation needs vs what got stripped. The
       chip styling lets the row stay scannable next to the byte columns. */
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px 0 6px 16px;
    }

    .features .chip {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .features .chip.kept {
      background: #e8f5ee;
      color: #1d6b3e;
      border-color: #c0e4cf;
    }

    .features .chip.stripped {
      background: #fbeaea;
      color: #9d3232;
      border-color: #ecc2c2;
      text-decoration: line-through;
      text-decoration-color: #c87a7a;
    }

    .features .label {
      font-size: 11px;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      align-self: center;
      margin-right: 2px;
    }

    /* Highlight the embedded-vs-extern delta — it's the matrix's headline. */
    #size-table tbody tr.delta.headline td {
      background: #f5faff;
    }
  </style>
</head>

<body>
  <h1>ulottie vs lottie-web: All Animations</h1>
  <div class="controls">
    <select id="anim-select">
      <option value="boucing-ball">Bouncing Ball</option>
      <option value="bouncy_ball">Bouncy Ball (lottie-docs)</option>
      <option value="ellipse">Ellipse</option>
      <option value="rectangle">Rectangle</option>
      <option value="fill">Fill (paths)</option>
      <option value="trim_path">Trim Path</option>
      <option value="lottie-logo">Lottie Logo</option>
      <option value="lights">Lights</option>
      <option value="ripple">Ripple</option>
      <option value="starfish">Starfish</option>
      <option value="precomp_star_circle">Precomp Star Circle</option>
    </select>
    <label id="file-picker">or load file: <input type="file" id="file-input" accept=".json,application/json"></label>
    <br><br>
    <label>Frame: <span id="frame-display">0</span> / <span id="total-frames">0</span></label><br>
    <input type="range" id="scrubber" min="0" max="100" step="1" value="0">
    <div id="upload-status">Tip: drop a Lottie .json anywhere on this page to compile and compare.</div>
  </div>
  <div class="compare">
    <div class="panel">
      <h2>lottie-web (reference)</h2>
      <div id="lottie-ref"></div>
    </div>
    <div class="panel">
      <h2>ulottie (compiled)</h2>
      <div id="ulottie"></div>
    </div>
  </div>
  <section class="sizes">
    <h2>Payload size</h2>
    <table id="size-table">
      <thead>
        <tr>
          <th></th>
          <th>Raw</th>
          <th>Gzipped</th>
        </tr>
      </thead>
      <tbody>
        <tr class="measuring"><td colspan="3">load an animation to measure</td></tr>
      </tbody>
    </table>
  </section>
  <div id="drop-hint"></div>

  <script src="./lottie.min.js"></script>
  <script>
    let currentAnim = null;
    let ulottieResult = null;
    let ulottieModule = null;

    const select = document.getElementById('anim-select');
    const scrubber = document.getElementById('scrubber');
    const frameDisplay = document.getElementById('frame-display');
    const totalFrames = document.getElementById('total-frames');
    const fileInput = document.getElementById('file-input');
    const dropHint = document.getElementById('drop-hint');
    const uploadStatus = document.getElementById('upload-status');

    // Single load path: POST the source JSON to `/compile`, render both
    // panels from the response. Server-side compilation is mtime-cached so
    // reposting a fixture is cheap.
    async function loadFromSource(jsonText, label) {
      document.getElementById('lottie-ref').innerHTML = '';
      document.getElementById('ulottie').innerHTML = '';
      if (currentAnim) currentAnim.destroy();
      if (ulottieResult) ulottieResult.destroy();

      let info;
      try {
        const res = await fetch('/compile', {method: 'POST', body: jsonText});
        if (!res.ok) throw new Error(await res.text());
        info = await res.json();
      } catch (e) {
        uploadStatus.textContent = 'Compile failed: ' + e.message;
        renderSizes(null);
        return;
      }
      renderSizes(info.sizes);

      currentAnim = lottie.loadAnimation({
        container: document.getElementById('lottie-ref'),
        renderer: 'svg',
        loop: false,
        autoplay: false,
        animationData: JSON.parse(jsonText),
      });

      currentAnim.addEventListener('DOMLoaded', () => {
        const tf = Math.round(currentAnim.totalFrames);
        scrubber.max = tf - 1;
        totalFrames.textContent = tf;
        scrubber.value = 0;
        frameDisplay.textContent = 0;
        currentAnim.goToAndStop(0, true);
      });

      try {
        // Cache-bust so reloads always see fresh JS.
        ulottieModule = await import(info.jsUrl + '?t=' + Date.now());
        ulottieResult = ulottieModule.init(document.getElementById('ulottie'));
        ulottieResult.destroy();
        ulottieResult.goToFrame(0);
      } catch (e) {
        document.getElementById('ulottie').textContent = 'Error: ' + e.message;
      }
      if (label) uploadStatus.textContent = 'Loaded: ' + label;
    }

    async function loadFixture(name) {
      const res = await fetch('/.output/' + name + '.json');
      if (!res.ok) {
        uploadStatus.textContent = 'Fetch failed: ' + res.status;
        return;
      }
      await loadFromSource(await res.text(), name);
    }

    async function loadUploaded(file) {
      uploadStatus.textContent = 'Compiling ' + file.name + '…';
      await loadFromSource(await file.text(), file.name);
    }

    // ----- Size panel rendering -----

    const fmtBytes = (n) => {
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / 1024 / 1024).toFixed(2) + ' MB';
    };
    const fmtDelta = (n) =>
      (n >= 0 ? '+' : '−') + fmtBytes(Math.abs(n));
    // Percentage with sign, formatted to match the delta column. `base`
    // protects against div-by-zero on degenerate fixtures.
    const fmtPct = (delta, base) => {
      if (!base) return '';
      const pct = Math.round((delta / base) * 100);
      const sign = pct > 0 ? '+' : pct < 0 ? '−' : '';
      return ` (${sign}${Math.abs(pct)}%)`;
    };
    // Each delta cell is colored from its own sign — raw and gz can disagree.
    const cellClass = (n) => n > 0 ? 'loss' : n < 0 ? 'gain' : '';
    const dCell = (n) => `<td class="${cellClass(n)}">${fmtDelta(n)}</td>`;
    const dCellPct = (n, base) =>
      `<td class="${cellClass(n)}">${fmtDelta(n)}${fmtPct(n, base)}</td>`;

    // Render the "Tree-shaken: …" row beneath the embedded pipeline header.
    // Each feature is a chip; kept = green, stripped = struck-through red.
    // The byte cost is appended in parentheses so the user can see at a
    // glance which features dominate.
    function featuresRow(features, costs) {
      const items = [
        ['expressions', features.expressions, costs.expressions],
        ['trim-path',   features.trimPath,    costs.trimPath],
        ['gradient',    features.gradient,    costs.gradient],
      ];
      const chips = items.map(([name, kept, cost]) => {
        const klass = kept ? 'kept' : 'stripped';
        const sign = kept ? '+' : '−';
        return `<span class="chip ${klass}">${name} ${sign}${fmtBytes(Math.max(0, cost))}</span>`;
      }).join('');
      return `
        <tr><td colspan="3">
          <div class="features">
            <span class="label">Tree-shaken</span>${chips}
          </div>
        </td></tr>`;
    }

    function renderSizes(s) {
      const tbody = document.querySelector('#size-table tbody');
      if (!s) {
        tbody.innerHTML =
          '<tr class="measuring"><td colspan="3">no data</td></tr>';
        return;
      }
      // Apples-to-apples: each pipeline ships its source + its runtime.
      const lottieTotal = {
        raw: s.json.raw + s.lottieRuntime.raw,
        gz: s.json.gzipped + s.lottieRuntime.gzipped,
      };
      const ulottieTotal = {
        raw: s.js.raw + s.ulottieRuntime.raw,
        gz: s.js.gzipped + s.ulottieRuntime.gzipped,
      };
      const delta = {
        raw: ulottieTotal.raw - lottieTotal.raw,
        gz: ulottieTotal.gz - lottieTotal.gz,
      };
      // Per-fixture payload delta (independent of runtime; the asymptotic
      // amortized cost when many animations share the same runtime).
      const dPayload = {
        raw: s.js.raw - s.json.raw,
        gz: s.js.gzipped - s.json.gzipped,
      };
      // Embedded mode: self-contained, tree-shaken & minified runtime inlined.
      const embeddedDelta = {
        raw: s.jsEmbedded.raw - lottieTotal.raw,
        gz: s.jsEmbedded.gzipped - lottieTotal.gz,
      };
      const ef = s.embeddedFeatures;
      tbody.innerHTML = `
        <tr class="pipeline"><td colspan="3">Lottie pipeline</td></tr>
        <tr><td>Lottie JSON</td><td>${fmtBytes(s.json.raw)}</td><td>${fmtBytes(s.json.gzipped)}</td></tr>
        <tr><td>lottie-web runtime (lottie.min.js)</td><td>${fmtBytes(s.lottieRuntime.raw)}</td><td>${fmtBytes(s.lottieRuntime.gzipped)}</td></tr>
        <tr class="subtotal"><td>= Lottie total</td><td>${fmtBytes(lottieTotal.raw)}</td><td>${fmtBytes(lottieTotal.gz)}</td></tr>

        <tr class="pipeline"><td colspan="3">ulottie pipeline (extern, shared runtime)</td></tr>
        <tr><td>Compiled JS</td><td>${fmtBytes(s.js.raw)}</td><td>${fmtBytes(s.js.gzipped)}</td></tr>
        <tr><td>ulottie runtime (driver.min.js)</td><td>${fmtBytes(s.ulottieRuntime.raw)}</td><td>${fmtBytes(s.ulottieRuntime.gzipped)}</td></tr>
        <tr class="subtotal"><td>= ulottie total</td><td>${fmtBytes(ulottieTotal.raw)}</td><td>${fmtBytes(ulottieTotal.gz)}</td></tr>
        <tr class="delta"><td>Δ vs Lottie</td>${dCellPct(delta.raw, lottieTotal.raw)}${dCellPct(delta.gz, lottieTotal.gz)}</tr>

        <tr class="pipeline"><td colspan="3">ulottie pipeline (embedded, tree-shaken &amp; minified)</td></tr>
        ${featuresRow(ef.included, ef.costRaw)}
        <tr class="subtotal"><td>= embedded total</td><td>${fmtBytes(s.jsEmbedded.raw)}</td><td>${fmtBytes(s.jsEmbedded.gzipped)}</td></tr>
        <tr class="delta headline"><td>Δ vs Lottie</td>${dCellPct(embeddedDelta.raw, lottieTotal.raw)}${dCellPct(embeddedDelta.gz, lottieTotal.gz)}</tr>

        <tr class="delta"><td>Δ amortized payload (JS − JSON)</td>${dCell(dPayload.raw)}${dCell(dPayload.gz)}</tr>
      `;
    }

    scrubber.addEventListener('input', () => {
      const frame = parseInt(scrubber.value);
      frameDisplay.textContent = frame;
      if (currentAnim) currentAnim.goToAndStop(frame, true);
      if (ulottieResult && ulottieResult.goToFrame) ulottieResult.goToFrame(frame);
    });

    select.addEventListener('change', () => loadFixture(select.value));
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) loadUploaded(file);
    });

    // Drag-and-drop anywhere on the page. We swallow dragover/leave so the
    // browser doesn't navigate to the dropped file.
    document.addEventListener('dragover', (e) => {
      if (e.dataTransfer?.types?.includes('Files')) {
        e.preventDefault();
        dropHint.classList.add('active');
      }
    });
    document.addEventListener('dragleave', (e) => {
      if (e.target === document || e.target === document.body) {
        dropHint.classList.remove('active');
      }
    });
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      dropHint.classList.remove('active');
      const file = e.dataTransfer?.files?.[0];
      if (file && file.name.endsWith('.json')) loadUploaded(file);
    });

    loadFixture(select.value);
  </script>
</body>

</html>
