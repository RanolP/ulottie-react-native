<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Compare All Animations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui;
      background: #f0f0f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .controls {
      text-align: center;
      margin-bottom: 16px;
    }

    .controls select {
      font-size: 14px;
      padding: 4px 8px;
    }

    .controls input[type=range] {
      width: 400px;
      vertical-align: middle;
    }

    .controls label {
      font-size: 14px;
      font-weight: bold;
    }

    .compare {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .panel {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .panel h2 {
      font-size: 14px;
      text-align: center;
      margin-bottom: 8px;
      color: #666;
    }

    #lottie-ref {
      width: 300px;
      height: 300px;
    }

    #ulottie {
      width: 300px;
      height: 300px;
      overflow: hidden;
    }

    #ulottie svg {
      max-width: 300px;
      max-height: 300px;
      display: block;
    }

    /* Drop zone for ad-hoc JSON files. Whole page accepts drag-and-drop; the
       overlay surfaces while a file is being dragged over. */
    #drop-hint {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 120, 255, 0.15);
      border: 4px dashed #0078ff;
      pointer-events: none;
      z-index: 1000;
    }

    #drop-hint.active {
      display: block;
    }

    #upload-status {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }

    #file-picker {
      display: inline-block;
      margin-left: 8px;
    }

    .sizes {
      margin: 16px auto 0;
      max-width: 640px;
      background: white;
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .sizes h2 {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 8px;
    }

    #size-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    #size-table th,
    #size-table td {
      padding: 4px 10px;
      text-align: right;
    }

    #size-table th:first-child,
    #size-table td:first-child {
      text-align: left;
    }

    #size-table thead th {
      border-bottom: 1px solid #ddd;
      font-weight: 600;
      color: #666;
    }

    #size-table tbody tr.delta {
      border-top: 1px solid #eee;
      font-weight: 600;
    }

    /* Delta cells color independently — raw and gz can disagree on sign
       (e.g. compiled JS shrinks raw but grows ~tens of bytes after gzip).
       Per-cell coloring makes the actual loss visible. */
    #size-table tbody td.loss {
      color: #c0392b;
    }

    #size-table tbody td.gain {
      color: #27ae60;
    }

    #size-table tbody tr.pipeline td {
      padding-top: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      border-bottom: 1px solid #f0f0f0;
    }

    #size-table tbody tr.subtotal td {
      font-weight: 600;
      border-top: 1px solid #f0f0f0;
    }

    #size-table tbody tr.measuring td {
      color: #999;
      font-style: italic;
    }

    /* "Tree-shaken: …" line under the embedded pipeline header — what the
       data backend decided this animation needs vs what got stripped. The
       chip styling lets the row stay scannable next to the byte columns. */
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px 0 6px 16px;
    }

    .features .chip {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .features .chip.kept {
      background: #e8f5ee;
      color: #1d6b3e;
      border-color: #c0e4cf;
    }

    .features .chip.stripped {
      background: #fbeaea;
      color: #9d3232;
      border-color: #ecc2c2;
      text-decoration: line-through;
      text-decoration-color: #c87a7a;
    }

    .features .label {
      font-size: 11px;
      color: #888;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      align-self: center;
      margin-right: 2px;
    }

    /* Highlight the embedded-vs-extern delta — it's the matrix's headline. */
    #size-table tbody tr.delta.headline td {
      background: #f5faff;
    }
  </style>
</head>

<body>
  <h1>ulottie vs lottie-web: All Animations</h1>
  <div class="controls">
    <select id="anim-select">
      <option value="boucing-ball">Bouncing Ball</option>
      <option value="bouncy_ball">Bouncy Ball (lottie-docs)</option>
      <option value="ellipse">Ellipse</option>
      <option value="rectangle">Rectangle</option>
      <option value="fill">Fill (paths)</option>
      <option value="trim_path">Trim Path</option>
      <option value="lottie-logo">Lottie Logo</option>
      <option value="lights">Lights</option>
      <option value="ripple">Ripple</option>
      <option value="starfish">Starfish</option>
      <option value="precomp_star_circle">Precomp Star Circle</option>
    </select>
    <label id="file-picker">or load file: <input type="file" id="file-input" accept=".json,application/json"></label>
    <br><br>
    <label>Frame: <span id="frame-display">0</span> / <span id="total-frames">0</span></label><br>
    <input type="range" id="scrubber" min="0" max="100" step="1" value="0">
    <div id="upload-status">Tip: drop a Lottie .json anywhere on this page to compile and compare.</div>
  </div>
  <div class="compare">
    <div class="panel">
      <h2>lottie-web (reference)</h2>
      <div id="lottie-ref"></div>
    </div>
    <div class="panel">
      <h2>ulottie (compiled)</h2>
      <div id="ulottie"></div>
    </div>
  </div>
  <section class="sizes">
    <h2>Payload size</h2>
    <table id="size-table">
      <thead>
        <tr>
          <th></th>
          <th>Raw</th>
          <th>Gzipped</th>
        </tr>
      </thead>
      <tbody>
        <tr class="measuring"><td colspan="3">load an animation to measure</td></tr>
      </tbody>
    </table>
  </section>
  <div id="drop-hint"></div>

  <!-- lottie-web reference runtime: classic script, populates `window.lottie`. -->
  <script src="./lottie.min.js"></script>
  <!--
    `app.js` imports `./compiler.js`. Which compile backend ships at
    that URL depends on the host: the dev server in `--mode api`
    overrides it with a fetch-based shim pointed at POST /compile;
    every other host (static deploy, dev server in `--mode static`)
    serves the on-disk wasm + worker variant. Same exports either way.
  -->
  <script type="module" src="./app.js"></script>
</body>

</html>
